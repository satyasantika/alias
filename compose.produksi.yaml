# Alias FKIP — produksi (pola docker-apps, Profil Ringan: STANDAR-TEKNIS §1b dan §7).
# MariaDB berjalan NATIVE di host (DB_HOST=host.docker.internal, db_alias): compose ini TIDAK memuat container
# database, Redis, Horizon, maupun worker terpisah. Cache, sesi, antrean, dan lock memakai database; worker
# dinyalakan penjadwal (alias-scheduler). Isi koneksi basis data di .env.production (lihat .env.production.example).
name: alias

# Log Docker dirotasi (STANDAR-TEKNIS §7.1).
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: alias-php:${ALIAS_VERSI:-latest}
  restart: unless-stopped
  env_file: .env.production
  extra_hosts: ["host.docker.internal:host-gateway"]
  logging: *log
  volumes:
    - alias-storage:/var/www/html/storage

services:
  alias-php:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: alias-php
    # Perkiraan awal; wajib dibuktikan dengan `docker stats` (STANDAR-TEKNIS §7.1).
    mem_limit: 512m
    environment:
      ALIAS_MIGRASI: ${ALIAS_MIGRASI:-0}      # set 1 sekali saat deploy pertama/rilis untuk menjalankan migrate
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  alias-nginx:
    image: nginx:1.27-alpine
    container_name: alias-nginx
    restart: unless-stopped
    mem_limit: 64m
    logging: *log
    ports:
      - "${ALIAS_PORT:-8018}:80"
    environment:
      NGINX_REAL_IP_FROM: ${NGINX_REAL_IP_FROM:-172.16.0.0/12}
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-_}
      NGINX_BASE_PATH: ${NGINX_BASE_PATH:-/alias}
    volumes:
      - ./docker/nginx/produksi.conf.template:/etc/nginx/templates/default.conf.template:ro
      - alias-public:/var/www/html/public:ro
    depends_on:
      alias-php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Penjadwal sekaligus pemicu worker antrean (routes/console.php: queue:work tiap menit, --stop-when-empty).
  # Worker berjalan sebagai subproses container ini; batas memori mencakup worker default dan worker berat (--memory=512).
  # Nilai awal; wajib dibuktikan dengan `docker stats` (STANDAR-TEKNIS §7.1).
  alias-scheduler:
    <<: *app
    container_name: alias-scheduler
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 768m
    stop_grace_period: 60s

volumes:
  alias-storage:
  alias-public:
