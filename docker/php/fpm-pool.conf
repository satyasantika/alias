; Profil Ringan (STANDAR-TEKNIS §1b): ondemand agar RAM server bersama tidak terpakai saat sepi.
; Alias adalah satu-satunya sistem dengan beban pengalihan publik; uji beban G-10a (docs/BEBAN.md) wajib diulang
; pada profil ini, dan max_children dinaikkan HANYA bila hasil ukur menuntutnya.
[www]
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 1000
catch_workers_output = yes
