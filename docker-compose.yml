# Melengkapi container bersama (/home/satya/code/docker-compose.yml, proyek "code") yang sudah menjalankan
# alias-php dan alias-nginx (port 8018). Hanya service yang BELUM ada ditambahkan di sini.
# Profil Ringan (STANDAR-TEKNIS §1b dan §2): MariaDB berjalan NATIVE di host (host.docker.internal), bukan container;
# tanpa Redis dan tanpa Horizon. Penjadwal menyalakan worker antrean `database` tiap menit (routes/console.php).
# Koneksi basis data, cache, sesi, dan antrean diatur .env (lihat .env.example); jangan ditimpa di sini.
x-app: &app
  image: code-alias-php
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment:
    MAIL_HOST: alias-mailpit
    MAIL_PORT: 1025
  extra_hosts: ["host.docker.internal:host-gateway"]
  networks: [laranet]

services:
  alias-mailpit:
    image: axllent/mailpit
    container_name: alias-mailpit
    networks: [laranet]
    ports:
      - "127.0.0.1:18018:8025"

  # Penjadwal sekaligus pemicu worker antrean (routes/console.php). Tidak ada container Horizon/queue terpisah.
  alias-scheduler:
    <<: *app
    container_name: alias-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    stop_grace_period: 60s

networks:
  laranet:
    external: true
    name: code_laranet
